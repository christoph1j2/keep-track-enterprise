services:
  # Apache & PHP service
  web:
    build: .
    container_name: web
    networks:
      - kiv-web
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-mydatabase}
      DB_USER: ${DB_USER:-myuser}
      DB_PASS: ${DB_PASS:-mypassword}
      DB_CHARSET: ${DB_CHARSET:-utf8mb4}
    depends_on:
      - db
    
  # MariaDB service
  db:
    image: mariadb:latest
    container_name: db
    networks:
      - kiv-web
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mydatabase}
      MYSQL_USER: ${MYSQL_USER:-myuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mypassword}
    volumes:
      - mariadb_data:/var/lib/mysql

  # phpMyAdmin service
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    networks:
      - kiv-web
    ports:
      - "${PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: ${PMA_HOST:-db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db

volumes:
  mariadb_data:

networks:
  kiv-web: